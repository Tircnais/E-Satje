<body>

  <main>
    <div class="container">

      <section class="section register min-vh-100 d-flex flex-column align-items-center justify-content-center py-4">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-lg-4 col-md-6 d-flex flex-column align-items-center justify-content-center">

              <div class="d-flex justify-content-center py-4">
                <a href="{{ url_for('dashboard') }}" class="logo d-flex align-items-center w-auto">
                  <img src="{{ url_for('static', filename= 'img/logo.png') }}" alt="">
                  <span class="d-none d-lg-block">Juicios</span>
                </a>
              </div><!-- End Logo -->

              <div class="card mb-3">

                <div class="card-body">

                  <div class="pt-4 pb-2">
                    <h5 class="card-title text-center pb-0 fs-4">Crear cuenta</h5>
                    <p class="text-center small">Ingrese los campos solicitados</p>
                  </div>

                  <form class="row g-3 needs-validation" action="{{ url_for('register') }}" id="formregistro" method="POST">
                    <div class="col-12">
                      <label for="yourName" class="form-label">Nombre</label>
                      <input type="text" name="name" class="form-control" id="name" placeholder="Ingrese su nombre" maxlength="200" required>
                      <div class="invalid-feedback">Ingrese su nombre</div>
                    </div>

                    <div class="col-12">
                      <label for="yourUsername" class="form-label">Apellidos</label>
                      <input type="text" name="lastname" class="form-control" id="lastname" placeholder="Ingrese su apellido" maxlength="200" required>
                      <div class="invalid-feedback">Ingrese su apellido</div>
                    </div>

                    <div class="col-12">
                      <label for="yourEmail" class="form-label">Correo</label>
                      <input type="email" name="email" class="form-control" id="email" placeholder="Ingrese su email" maxlength="200" required>
                      <div class="invalid-feedback">Please enter a valid Email adddress!</div>
                    </div>

                    <div class="col-12">
                      <label for="yourPassword" class="form-label">Clave</label>
                      <input type="password" name="password" class="form-control" id="password" placeholder="Ingrese su clave" maxlength="50" required>
                      <div class="invalid-feedback">Ingrese su clave</div>
                    </div>
                    <!--
                    <div class="col-12">
                      <div class="form-check">
                        <input class="form-check-input" name="terms" type="checkbox" value="" id="acceptTerms" required>
                        <label class="form-check-label" for="acceptTerms">I agree and accept the <a href="#">terms and conditions</a></label>
                        <div class="invalid-feedback">You must agree before submitting.</div>
                      </div>
                    </div>
                    -->
                    <div class="col-12">
                      <button class="btn btn-light w-100" type="submit" id="limpiar">Limpiar todo</button>
                      <button class="btn btn-primary w-100" type="submit" name="register">Registrarse</button>
                    </div>
                    <div class="col-12">
                      <p class="small mb-0">¿Ya tienes una cuenta? <a href="{{ url_for('login') }}">Ingresar</a></p>
                    </div>
                    <div class="col-12">
                      {% if mesage is defined and mesage %}
                          <div class=" text-break alert alert-warning">{{ mesage }}</div>
                      {% endif %}
                  </div>
                  </form>

                </div>
              </div>

  <script>
    function limpiarCampos() {
        // Obtén una referencia al formulario por su ID
        var formulario = document.getElementById("formregistro");

        // Recorre todos los elementos del formulario
        for (var i = 0; i < formulario.elements.length; i++) {
            var elemento = formulario.elements[i];

            // Verifica si el elemento es un campo de entrada (input) o un área de texto (textarea)
            if (elemento.tagName === "INPUT" || elemento.tagName === "TEXTAREA") {
                // Limpia el valor del campo
                elemento.value = "";
            }
        }
    }
    $(document).ready(function () {
        
        document.getElementById("limpiar").addEventListener("click", function() {
            limpiarCampos();
        });

    });
  </script>
