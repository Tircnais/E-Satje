{% block title %} {{datos['title']}} {% endblock %}

{% block body %}
<div class="row justify-content-center">
  <div class="col-md-6 text-center mb-2">
    <h2 class="heading-section">{{datos['title']}}</h2>
  </div>
</div>
<div class="row justify-content-center">

    <h3>Extraer datos del juicio</h3>
    <p>
      Ingrese el numero de proceso
      <input id="numeroproceso" type="text" value="" placeholder="Ingresa el numero de proceso 'XXXXX-XXXX-XXXXX'"/>
      <button id="busqueda">Busqueda Satje</button>
    </p>
  </div>
  <div class="col-md-4 text-justify">
    <p id="salida"></p>
  </div>
</div>
{% endblock %} {% block script %}
<script>

      numeroProceso = numeroProceso.replace(/-/g, '');

      numeroProceso.value = "";
      document.getElementById("numeroproceso").value = "";

      // Obtener el texto original del elemento

      salida.textContent =
        "Número de proceso: " + num_proceso + "\nConsultando espere..."; // O elemento.innerHTML = "Nuevo contenido HTML";

      // Envía el número de proceso al servidor utilizando una solicitud POST
      fetch("/extraeinfo", {
        method: "POST",

      })
